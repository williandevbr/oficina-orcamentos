name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências do servidor
        working-directory: server
        run: npm ci

      - name: Rodar testes do servidor
        working-directory: server
        run: npm test

      - name: Instalar dependências do site
        working-directory: client
        run: npm ci

      - name: Rodar testes do site
        working-directory: client
        run: npm test

      - name: Criar configuração do site
        working-directory: client
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env

      - name: Gerar o site
        working-directory: client
        run: npm run build

  publish:
    name: Publicar na Vercel
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v5

      - name: Publicar o site no ar
        working-directory: client
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p .vercel
          printf '{"projectId":"prj_u6w0s6B1nlEyzD42iCJgD9OLtp3f","orgId":"team_m855fhPmNxnP8tJn5gSnptwW"}' > .vercel/project.json
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
